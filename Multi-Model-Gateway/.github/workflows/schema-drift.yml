name: schema-drift

# Quoted so strict YAML 1.1 parsers (e.g. PyYAML) don't read `on` as a boolean.
"on": [push, pull_request]

jobs:
  schema-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image, not stock postgres:16 — the memories migration runs
        # CREATE EXTENSION vector, which the stock image doesn't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmgateway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The backend unit tests import app.core.config, whose pydantic Settings
    # require these even though only DATABASE_URL matters to alembic.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/llmgateway_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-schema-drift-secret
      ALGORITHM: HS256
      LM_URL: http://localhost:1234
      LM_DEFAULT_MODEL: ci-schema-drift-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Schema drift guard
        run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/llmgateway_ci bash backend/scripts/ci-schema-drift.sh

      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
