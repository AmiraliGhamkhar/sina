name: CI

# One workflow for the whole repo (docs PRs also run it — jobs are cheap and
# branch protection needs a stable, always-expected check set):
#   backend        pytest + ruff on the two supported Pythons
#   client-linux   C# compile gate via EnableWindowsTargeting (fast feedback
#                  for syntax/binding errors without waiting for the Windows queue)
#   client-windows dotnet build + xunit tests for the WPF projects (real run)
#   docker         compose config + API image build + import smoke

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend & AI · pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # >=3.11 is supported; production target is 3.12 (see pyproject note
        # and infrastructure/docker/Dockerfile.api)
        python-version: ["3.11", "3.12"]
    # Phase 8: real PostgreSQL + Redis services — the Phase 7 persistence
    # suite provisions a fresh database per test (MS_TEST_DATABASE_URL) and
    # the shared rate-limit backend is exercised against real Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medicalscribe
          POSTGRES_USER: medicalscribe
          POSTGRES_PASSWORD: medicalscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicalscribe -d medicalscribe"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,cache,security,observability]"

      - name: Lint (ruff)
        run: ruff check ai backend tests

      - name: Tests (pytest — sqlite locally, real Postgres + Redis via env)
        env:
          MS_TEST_DATABASE_URL: postgresql+asyncpg://medicalscribe:medicalscribe@localhost:5432/medicalscribe
          MS_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          set -o pipefail
          python -m pytest -r fx --color=yes 2>&1 | tee pytest.log

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable 2>&1 | tee pip-audit.log

      - name: Mirror pip-audit failure into annotation
        if: failure()
        run: |
          python - <<'EOF'
          import pathlib
          tail = pathlib.Path("pip-audit.log").read_text(errors="replace")[-3800:]
          ann = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace("|", "%7C")
          print(f"::error file=pip-audit.log::{ann}")
          EOF

      # The sandboxed dev environment cannot fetch Actions blob logs, so every
      # failing step mirrors its tail into a check-run annotation (readable via
      # the REST API). Harmless on normal failures; remove once redundant.
      - name: Mirror pytest failure into annotation
        if: failure()
        run: |
          python - <<'EOF'
          import pathlib
          tail = pathlib.Path("pytest.log").read_text(errors="replace")[-3800:]
          ann = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace("|", "%7C")
          print(f"::error file=pytest.log::{ann}")
          EOF

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  client-linux:
    name: WPF client · compile check (Linux targeting pack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # setup-dotnet's NuGet cache step hard-fails when ~/.nuget/packages
      # does not exist yet (fresh runner, pre-restore).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # EnableWindowsTargeting in both csproj files makes this a pure-compile
      # gate: catches C#/XAML codegen regressions without a Windows runner.
      - name: Build (Release)
        run: |
          set -o pipefail
          dotnet build client/MedicalScribe.sln -c Release --verbosity minimal 2>&1 | tee client-build.log

      - name: Mirror build failure into annotation
        if: failure()
        run: |
          python3 - <<'EOF'
          import pathlib, re
          raw = pathlib.Path("client-build.log").read_text(errors="replace")
          errs = [l for l in raw.splitlines() if re.search(r"error|Error\s", l)][:40] or raw.splitlines()[-40:]
          ann = "\n".join(errs)[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace("|", "%7C")
          print(f"::error file=client-build.log::{ann}")
          EOF

  client-windows:
    name: WPF client · build + tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: client-linux # skip the Windows queue unless it even compiles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore client/MedicalScribe.sln

      - name: Build (Release)
        run: dotnet build client/MedicalScribe.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath client-build.log

      - name: Test (xunit — parser, reconnect policy, transcript sink)
        run: >-
          dotnet test client/MedicalScribe.WPF.Tests/MedicalScribe.WPF.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=client-tests.trx"
          --results-directory TestResults 2>&1 | Tee-Object -FilePath client-test.log

      - name: Mirror failure into annotation
        if: failure()
        shell: pwsh
        run: |
          $log = if (Test-Path client-test.log) { "client-test.log" } elseif (Test-Path client-build.log) { "client-build.log" } else { "" }
          if ($log) {
            $raw = (Get-Content $log -Raw)
            $tail = $raw.Substring([Math]::Max(0, $raw.Length - 3500))
            $ann = $tail.Replace("%","%25").Replace("`r","").Replace("`n","%0A").Replace("|","%7C")
            Write-Output "::error file=$log::$ann"
          } else {
            Write-Output "::error file=client-windows::build/test step failed before any log was produced"
          }

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results-windows
          path: TestResults/*.trx
          if-no-files-found: ignore

  docker:
    name: Packaging · compose config + API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          touch .env   # compose requires the env_file to exist for `config`
          docker compose -f docker-compose.yml config --quiet
          echo "compose config: OK"

      - name: Build API image
        run: docker build -t medicalscribe-api:ci -f infrastructure/docker/Dockerfile.api .

      - name: Import smoke inside the image
        run: >-
          docker run --rm medicalscribe-api:ci
          python -c "import api.main, ai.registry;
          r = ai.registry.build_default_registry();
          assert len(r) >= 10, f'registry too small: {len(r)}';
          print('image imports OK, providers:', len(r))"
