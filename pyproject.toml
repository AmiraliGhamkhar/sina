[project]
name = "medicalscribe"
version = "0.1.0"
description = "MedicalScribe — Windows medical speech-to-text + AI clinical documentation platform (backend + AI layer)"
readme = "README.md"
requires-python = ">=3.11"
# Production target is Python 3.12+ (spec); >=3.11 kept so CI/dev sandboxes can
# run the same code. Nothing 3.12-only is used before Phase 3.
license = { text = "Proprietary (MedicalScribe); see docs/THIRD_PARTY_NOTICES.md for reference-project attributions" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT>=2.9",
    # Phase 3: multipart upload parsing + outbound WS to cloud STT providers
    "python-multipart>=0.0.9",
    "websockets>=12",
    "anyio>=4.3",  # direct: ClosedResourceError guard on WS sends (starlette transit anyway)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Phase 7 — PostgreSQL persistence
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiosqlite>=0.20",   # tests only
]
# Phase 7 — Redis (rate limiting, queues, shared state)
cache = [
    "redis>=5.0",
]
# Phase 7 — password hashing + provider-secret encryption
security = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `api` lives under backend/, `ai` at repo root — both install as top-level
# packages so `import api...` and `import ai...` work in dev, tests and Docker
# (setuptools records the correct per-package roots from `where`).
where = ["backend", "."]
include = ["api*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",
    # (str, Enum) kept over StrEnum: Pydantic v2 + json round-trip semantics
    # are better-understood with str mixin members, and .value is always
    # used explicitly for serialization.
    "UP042",
    # _recv_json is a helper, not an API coroutine; timeout param is fine
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "B017"]
