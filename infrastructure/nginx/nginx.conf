# MedicalScribe edge gateway — TLS termination + WebSocket upgrade proxy.
# WPF talks to https://<host>:8443 (REST + WS through the same origin).
# In production place behind your corporate LB and pin client trust to the
# certificate emitted here (client ships with the CA thumbprint in settings).

upstream mscribe_api {
    server api:8000;
    # Phase 1 WS sessions are in-process → a single api worker. When Redis
    # lands (Phase 7) switch to least_conn + multiple workers safely.
    keepalive 32;
}

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/medicalscribe.crt;   # mount via compose
    ssl_certificate_key /etc/nginx/certs/medicalscribe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # security headers (defense-in-depth; app sets its own too)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # audio frames up to MS_WEBSOCKET__MAX_MESSAGE_BYTES; keep bodies small
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://mscribe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://mscribe_api;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://mscribe_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # long-lived dictation sessions: generous idle, no response buffering
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # deliberately NOT proxied: /docs and /openapi.json (prod), /metrics
    # (scraped internally via prometheus, not exposed at the edge).
    location = /docs { return 404; }
    location = /openapi.json { return 404; }
}
