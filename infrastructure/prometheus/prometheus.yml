# Prometheus scrape config (Phase 8: /metrics is live — dependency-free text
# exposition from api/routes/metrics.py; all series are prefixed
# `medicalscribe_`). Grafana dashboard: grafana-dashboard.json (compose
# `--profile monitoring` brings up Prometheus + Grafana).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: medicalscribe-api
    metrics_path: /metrics          # Phase 8: Prometheus text endpoint
    static_configs:
      - targets: ["api:8000"]
  # optional exporters (compose `--profile monitoring` + sidecars):
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
